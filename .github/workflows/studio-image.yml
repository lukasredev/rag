# Builds the shared, read-only RAG Studio image (studio/Dockerfile) and pushes it to the GitHub container
# registry as ghcr.io/<owner>/<repo>:latest (and :sha-..., and :vX.Y for tags vX.Y).
#
# Runs in the repo of the STUDENT BUNDLE (scripts/make_student_repo.py), which contains the corpora. In the
# instructor repo it skips the build: that repo has no corpora in git and must never be turned into an image.

name: studio image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only the student bundle becomes an image
        id: check
        run: |
          if ls -d tracks/*/hidden >/dev/null 2>&1; then
            echo "::notice::This is the instructor repo (hidden eval sets present): not building the Studio image."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f tracks/papers/data/papers.jsonl ]; then
            echo "::error::No corpora in tracks/*/data: build this from the student bundle (scripts/make_student_repo.py)."
            exit 1
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.build == 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        if: steps.check.outputs.build == 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      # pull requests only check that the image builds; pushes to main and tags publish it
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          file: studio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the public repo: the footer links to the commit
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REPO=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
